# blindsight router: the one API address for the client, whatever API format it speaks to the text model (Anthropic
# Messages, OpenAI Chat Completions / Responses, Ollama /api/chat and /api/generate, Gemini, ...). Reads only the JSON
# "model" field of request bodies (for the log) and never rewrites a body:
#   no image/document/file part -> text model (TEXT_URL), body byte for byte; only the Host header and the TEXT_URL
#       path prefix are set (the query is kept; every other header, the client's API key included, passes through)
#   media part, or a body HAProxy could not check (too big, compressed, not plain JSON text) -> imgfix (:8080
#       container) -> text model with each part swapped for a text reference (vision-mcp's ask_image tool / GET /ask
#       lets the text model question the vision model). imgfix down/unhealthy -> 400 (fail closed: such a request
#       never goes to the text model directly). Protocol upgrades (WebSocket) -> 400.
# router/entrypoint.sh derives the TEXT_* variables below from TEXT_URL (compose.yaml passes it from .env) and refuses
# a bad one (exit 2). TEXT_DNS=static (IP literal or /etc/hosts name): resolved once at startup. runtime (any other
# name): resolved at startup (libc) and then re-resolved through Docker's DNS, so hosted APIs that rotate addresses
# keep working. A name that does not resolve at startup makes HAProxy refuse to start.

.if !defined(TEXT_SCHEME) || !defined(TEXT_ADDR) || !defined(TEXT_AUTHORITY) || !defined(TEXT_DNS)
  .alert "TEXT_* are not set: start HAProxy through router/entrypoint.sh, which derives them from TEXT_URL"
.endif

global
  nbthread 2
  maxconn 512
  tune.bufsize.large 33554432          # 32 MiB: room for a whole long agent request body
  log stdout format raw local0 info

defaults
  mode http
  log global
  option dontlognull
  timeout connect 5s
  timeout client 60m
  timeout server 60m
  timeout http-request 300s
  timeout http-keep-alive 60s

# Docker's embedded DNS: the router starts without imgfix and follows it when it (re)starts with a new IP; also used
# for a TEXT_URL host with TEXT_DNS=runtime.
resolvers docker
  parse-resolv-conf
  hold valid 10s

frontend api
  bind :8100
  monitor-uri /router-health
  # Path only: no query string (a client may pass its API key as ?key=...), no request bodies, no headers.
  log-format "%tr %ci %HM %HPO model=%[var(txn.model)] -> %b %ST %B bytes %Tt ms"
  # Protocol upgrades (the Responses API's WebSocket transport, h2c, RFC 8441 CONNECT) would carry later messages
  # past every check below: refuse them with a non-retryable 400 (clients such as Codex fall back to plain HTTP).
  http-request return status 400 content-type application/json string '{"type":"error","error":{"type":"invalid_request_error","code":"blindsight_upgrade_unsupported","param":null,"message":"blindsight does not support WebSocket or other protocol upgrades: it checks every request body for images. Use the plain HTTP API (most clients fall back to it automatically)."}}' if { req.hdr_cnt(upgrade) gt 0 } || METH_CONNECT
  # Every request (any method) is held until its body is complete, at most 300 s and 32 MiB (tune.bufsize.large). A
  # body still arriving after 300 s gets HAProxy's 408 (nothing is forwarded); a bigger one is routed to imgfix below.
  http-request wait-for-body time 300s use-large-buffer
  http-request set-var(txn.model) req.body,json_query('$.model')
  http-request set-var(txn.blen) req.body_len
  # Media parts must never reach the text-only model (one image => HTTP 400, and since clients re-send the history
  # the session stays broken): such requests go to imgfix, which replaces them. Any of these sends a request there.
  # A false positive only costs a trip through imgfix (it forwards a body without media unchanged), so they err broad.
  # Media shapes, case-insensitive, any depth, any API format:
  #   "type": image | document                       Anthropic Messages
  #   "type": image_url | file, an "image_url" key    OpenAI Chat Completions (vLLM also takes untyped image_url parts)
  #   "type": input_image | input_file | computer_screenshot   OpenAI Responses
  #   an "inline_data" / "inlineData" / "file_data" / "fileData" key   Gemini (and OpenAI file parts)
  #   "images": [ <anything> ...                      Ollama /api/chat (per message) and /api/generate (top level);
  #                                                   Ollama (Go) matches JSON keys case-insensitively, hence -i
  acl has_media   req.body -m reg -i '"type"\s*:\s*"(image|document|image_url|input_image|input_file|file|computer_screenshot)"'
  acl has_media   req.body -m reg -i '"(image_url|inline_data|inlinedata|file_data|filedata)"\s*:'
  acl has_media   req.body -m reg -i '"images"\s*:\s*\[\s*[^\s\]]'
  # Bodies the patterns above cannot read reliably:
  #   - compressed (any Content-Encoding) - the patterns would see compressed bytes
  #   - a NUL byte (UTF-16/32, binary): HAProxy's string view of the body (what -m reg and length see) stops at the
  #     first NUL, so a shorter string length than the body length means one is there and the rest was not checked
  #   - not starting with "{" after JSON whitespace (BOM, array, form, multipart, ...)
  #   - an escaped printable ASCII character (backslash-u 0020 to 007F), which could spell a key or a type value
  #     (e.g. "type":"\u0069mage" is "type":"image")
  acl body_odd    req.hdr_cnt(content-encoding) gt 0
  acl body_odd    req.body,length,sub(txn.blen) lt 0
  acl body_odd    req.body -m reg '^[\t\n\r ]*[^\t\n\r {]'
  acl body_odd    req.body -m reg '\\u00[2-7][0-9a-fA-F]'
  # A body HAProxy did not see whole may hide a part: imgfix (which parses all of it) gets those.
  acl body_unseen req.body_size,sub(txn.blen) gt 0         # Content-Length body not fully buffered
  acl body_unseen req.body_len ge 31457280                 # chunked body that may have filled the buffer (30 MiB+)
  # Decided once (the regexes scan up to 32 MiB). The model name plays no part (PASSTHROUGH_MODELS is imgfix's).
  http-request set-var(txn.imgfix) bool(true) if has_media || body_odd || body_unseen
  # imgfix down or unhealthy (store not writable): refuse with a non-retryable 400 (a 5xx would be retried many times
  # by agent clients). The body parses as an error for Anthropic clients (top-level "type":"error", error.type,
  # error.message) and OpenAI clients (error.message/type/code/param). Never fall through to the text model.
  http-request return status 400 content-type application/json string '{"type":"error","error":{"type":"invalid_request_error","code":"blindsight_imgfix_unavailable","param":null,"message":"The blindsight image proxy (imgfix) is offline or unhealthy, so this request (it has images, documents or files, or is too big or unusual to check) cannot be sent to the text-only model. Start it again from the blindsight directory: docker compose up -d imgfix"}}' if { var(txn.imgfix) -m bool } { nbsrv(imgfix) eq 0 }
  use_backend imgfix if { var(txn.imgfix) -m bool }
  default_backend text

backend text
  # Hosted APIs (and their TLS front ends) route on the Host header: always TEXT_URL's authority.
  http-request set-header Host "${TEXT_AUTHORITY}"
.if defined(TEXT_PREFIX_FMT)
  http-request set-path "${TEXT_PREFIX_FMT}%[path]"        # TEXT_URL path prefix + client path; query unchanged
.endif
.if streq("${TEXT_SCHEME}",https)
  # Certificate checked against the system CAs (or TEXT_CA_FILE) and the host name (SNI). No way to turn this off.
  default-server ssl verify required sni "str(${TEXT_HOST})"
 .if defined(TEXT_CA_FILE)
  default-server ca-file "${TEXT_CA_FILE}"
 .else
  default-server ca-file @system-ca
 .endif
.endif
.if streq("${TEXT_DNS}",runtime)
  default-server resolvers docker resolve-prefer ipv4 init-addr libc
.endif
  server text "${TEXT_ADDR}"

backend imgfix
  option httpchk GET /imgfix-health
  server imgfix imgfix:8080 check inter 5s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
