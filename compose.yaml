# blindsight: give a text-only model behind the Anthropic Messages API "eyes".
#   router     HAProxy, the client's API address (${BIND_ADDR}:${ROUTER_PORT}). Text-only requests go straight to the
#              text model byte for byte; image/document-bearing (or too-big-to-check) requests go to imgfix.
#   imgfix     mitmproxy addon (imgfix/imgfix.py): swaps each image/document block for a fixed text reference, stores
#              the bytes in the blindsight-store volume, forwards to the text model. Internal only (no published port).
#   vision-mcp MCP server (vision-mcp/server.py) with the ask_image tool at ${BIND_ADDR}:${MCP_PORT}/mcp: shows a
#              stored image to the vision model and returns its answer. Reads blindsight-store read-only.
# imgfix down => the router answers image/document requests with a 400 (never sends them to the text model); start
# it again with: docker compose up -d imgfix
# Config: .env next to this file (see .env.example; VISION_MODEL is required).
# Start: docker compose up -d --build   Stop: docker compose down (keeps the store volume; never down -v unless you
# want to delete every stored image)
# Validate: docker compose config --quiet && docker compose run --rm --no-deps router haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
# Stack test (stub models, no GPU): test/run.sh
name: blindsight

services:
  router:
    image: haproxy:3.4.6-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a
    restart: "no"
    read_only: true
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:                         # used by haproxy.cfg as "${TEXT_HOST}:${TEXT_PORT}"
      TEXT_HOST: ${TEXT_HOST:-host.docker.internal}
      TEXT_PORT: ${TEXT_PORT:-8000}
    extra_hosts: [ "host.docker.internal:host-gateway" ]   # Linux; Docker Desktop provides it anyway
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ROUTER_PORT:-8100}:8100"
    networks: [ blindsight ]
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 10s
    logging: { driver: local, options: { max-size: "20m", max-file: "3" } }
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8100/router-health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reached only by the router (imgfix:8080); no published port. Runs as uid 1000.
  imgfix:
    build: { context: ./imgfix, target: runtime }
    image: blindsight-imgfix:local
    restart: "no"
    read_only: true
    tmpfs: [ "/tmp:size=256m" ]          # mitmproxy confdir + count_tokens PDF scratch
    volumes:
      - blindsight-store:/store          # first mount of a fresh volume copies the image's 1000:1000 /store
    environment:
      TEXT_UPSTREAM: http://${TEXT_HOST:-host.docker.internal}:${TEXT_PORT:-8000}
      VISION_BASE_URL: ${VISION_BASE_URL:-http://host.docker.internal:8001/v1}
      VISION_MODEL: ${VISION_MODEL:?VISION_MODEL is not set. Copy .env.example to .env and set VISION_MODEL to the model name your vision server serves}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_EXTRA_BODY: ${VISION_EXTRA_BODY:-}
      IMGFIX_STORE: /store
      IMGFIX_MIN_FREE_GB: ${IMGFIX_MIN_FREE_GB:-5}   # below this much free disk, new images/PDFs become "unavailable"
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    networks: [ blindsight ]
    mem_limit: 1g                        # Pillow decodes images up to 50 MP (2 at a time); bodies <= 64 MiB; poppler capped
    cpus: 2
    pids_limit: 256
    stop_grace_period: 10s
    logging: { driver: local, options: { max-size: "20m", max-file: "3" } }
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/imgfix-health', timeout=4)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ask_image MCP server: streamable HTTP at :8102/mcp. Runs as uid 10001.
  vision-mcp:
    build: { context: ./vision-mcp, target: runtime }
    image: blindsight-vision-mcp:local
    restart: "no"
    read_only: true
    tmpfs: [ "/tmp:size=256m" ]          # pdftoppm page renders
    volumes:
      - blindsight-store:/store:ro
    environment:
      STORE_DIR: /store
      VISION_BASE_URL: ${VISION_BASE_URL:-http://host.docker.internal:8001/v1}
      VISION_MODEL: ${VISION_MODEL:?VISION_MODEL is not set. Copy .env.example to .env and set VISION_MODEL to the model name your vision server serves}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_EXTRA_BODY: ${VISION_EXTRA_BODY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,vision-mcp:*}
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8102}:8102"
    networks: [ blindsight ]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 10s
    logging: { driver: local, options: { max-size: "20m", max-file: "3" } }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=4)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  blindsight: {}

volumes:
  blindsight-store: {}                   # Docker name: blindsight_blindsight-store (user data: never down -v)
