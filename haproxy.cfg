# blindsight router: the one Anthropic Messages API address for the client (e.g. Claude Code).
# Reads only the JSON "model" field of POST bodies (for the log) and forwards every byte unchanged (no body/header
# rewriting):
#   no image/document block            -> text model ("${TEXT_HOST}:${TEXT_PORT}", byte for byte)
#   image/document block, or a body HAProxy could not see whole -> imgfix (:8080 container) -> text model with each
#       block swapped for a text reference (vision-mcp ask_image lets the text model ask the vision model about it).
#       imgfix down/unhealthy -> 400 (fail closed: such a request never goes to the text model directly).
# TEXT_HOST / TEXT_PORT come from the environment (compose.yaml passes them from .env). The address is resolved once at
# startup (libc: /etc/hosts, then DNS); an unresolvable TEXT_HOST makes HAProxy refuse to start.

.if !defined(TEXT_HOST) || !defined(TEXT_PORT)
  .alert "TEXT_HOST and TEXT_PORT must be set (compose.yaml passes them from .env)"
.endif

global
  nbthread 2
  maxconn 512
  tune.bufsize.large 33554432          # 32 MiB: room for a whole long Claude Code request body
  log stdout format raw local0 info

defaults
  mode http
  log global
  option dontlognull
  timeout connect 5s
  timeout client 60m
  timeout server 60m
  timeout http-request 300s
  timeout http-keep-alive 60s

# Docker's embedded DNS, so the router starts without imgfix and follows it when it (re)starts with a new IP.
resolvers docker
  parse-resolv-conf
  hold valid 10s

frontend api
  bind :8100
  monitor-uri /router-health
  log-format "%tr %ci %HM %HU model=%[var(txn.model)] -> %b %ST %B bytes %Tt ms"
  http-request wait-for-body time 300s use-large-buffer if METH_POST
  http-request set-var(txn.model) req.body,json_query('$.model') if METH_POST
  http-request set-var(txn.blen) req.body_len if METH_POST
  # Image/document blocks must never reach the text-only model (one image => HTTP 400, and since clients re-send the
  # history the session stays broken): such requests go to imgfix, which replaces them. HAProxy holds at most 32 MiB
  # of a body (tune.bufsize.large) and waits at most 300 s for it, so a body it did not see whole may hide a block:
  # imgfix (which parses all of it) gets those. The model name plays no part in this decision.
  acl has_media   req.body -m reg '"type"\s*:\s*"(image|document)"'
  acl body_unseen req.body_size,sub(txn.blen) gt 0         # Content-Length body not fully buffered
  acl body_unseen req.body_len ge 31457280                 # chunked body that may have filled the buffer (30 MiB+)
  # imgfix down or unhealthy (store not writable): refuse with a non-retryable Anthropic-style error (a 5xx would be
  # retried many times by Claude Code). Never fall through to the text model.
  http-request return status 400 content-type application/json string '{"type":"error","error":{"type":"invalid_request_error","message":"The blindsight image proxy (imgfix) is offline or unhealthy, so this request (it has images/documents, or is too big to check) cannot be sent to the text-only model. Start it again from the blindsight directory: docker compose up -d imgfix"}}' if METH_POST has_media { nbsrv(imgfix) eq 0 } || METH_POST body_unseen { nbsrv(imgfix) eq 0 }
  use_backend imgfix if METH_POST has_media || METH_POST body_unseen
  default_backend text

backend text
  server text "${TEXT_HOST}:${TEXT_PORT}"

backend imgfix
  option httpchk GET /imgfix-health
  server imgfix imgfix:8080 check inter 5s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
